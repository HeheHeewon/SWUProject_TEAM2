<!DOCTYPE html>
<html>
<head>
    <title>마이페이지</title>
</head>
<body>
    <h1>{{ request.user.username }} 님의 마이페이지</h1>
    
    <h2>기본 정보</h2>
    <p>아이디: {{ request.user.username }}</p>
    <p>이메일: {{ request.user.email }}</p>

    <h2>프로필 정보 (Profile 모델)</h2>
    <p>전화번호: {{ profile.phone_number|default:"미등록" }}</p>
    <p>주소: {{ profile.address|default:"미등록" }}</p>
    <p>누적 거래 횟수: {{ profile.total_transactions }}회</p>
    
    <a href="{% url 'accounts:profile_edit' %}">프로필 수정하기</a>
    
    <p><a href="{% url 'cart:cart_detail' %}">장바구니 보기</a></p>
    <p><a href="{% url 'accounts:logout' %}">로그아웃</a></p>
</body>
</html>
