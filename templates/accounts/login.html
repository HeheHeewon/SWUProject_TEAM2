{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h1 class="h5 mb-3">로그인</h1>
        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          {{ form.as_p }}
          <input type="hidden" name="next" value="{{ next|default:'/posts/' }}">
          <button class="btn btn-primary w-100">로그인</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
