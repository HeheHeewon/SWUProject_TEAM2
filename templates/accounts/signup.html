<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>회원가입</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="auth-form">
        <h1>회원가입</h1>
        
        <form method="post">
            {% csrf_token %} 
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">가입하기</button>
        </form>

        <p style="margin-top: 20px; text-align: center;">
            이미 계정이 있으신가요? 
            <a href="{% url 'accounts:login' %}">로그인</a>
        </p>
    </div>
</body>
</html>
