{% extends "base.html" %}
{% block title %}삭제 확인{% endblock %}
{% block content %}
<div class="card"><div class="card-body">
  <h1 class="h5">정말 삭제할까요?</h1>
  <p class="text-muted mb-3">“{{ object.title }}”</p>
  <form method="post">{% csrf_token %}
    <a class="btn btn-outline-secondary" href="{% url 'posts:detail' object.pk %}">취소</a>
    <button class="btn btn-danger">삭제</button>
  </form>
</div></div>
{% endblock %}
